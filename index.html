<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício HTML JS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <div class="container">
        <h1>Primeiro Número < Segundo Número</h1>
        <input type="number" placeholder="Digite o primeiro número" />
        <input type="number" placeholder="Digite o segundo número" />
        <button type="submit">Enviar</button>
        <p>
          <span id="success" class="result-success"></span>
          <span id="error" class="result-error">O primeiro precisa ser menor que o segundo.</span>
        </p>
      </div>
    </form>
    <script src="script.js"></script>
  </body>
</html>
